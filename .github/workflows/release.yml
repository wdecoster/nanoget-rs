name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

# Creating the release and attaching assets both write to the repository. Without this
# the default GITHUB_TOKEN is read-only and the release step fails with
# "Resource not accessible by integration".
permissions:
  contents: write

jobs:
  create-release:
    name: Create release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # The release notes are the CHANGELOG section for this version, so the tag and the
      # changelog cannot drift. Falling back to a pointer rather than failing the release
      # keeps a missing section from blocking the binaries.
      - name: Extract release notes from CHANGELOG
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { flag = 1; next }
            flag && /^## \[/ { exit }
            flag { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG.md section for $version; see the changelog for details." > release-notes.md
          fi
          cat release-notes.md

      - name: Create the release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          draft: false
          prerelease: false

  build-release:
    name: Build ${{ matrix.name }}
    needs: [create-release]
    runs-on: ${{ matrix.os }}
    strategy:
      # One target failing should not withhold the binaries that did build.
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: linux-musl
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            use_cross: true
          - name: macos
            os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # htslib (via rust-htslib) is compiled from C, and needs these for the gnu-Linux
      # build. The musl build links them statically inside the cross image; macOS uses
      # the bundled build from the SDK toolchain.
      - name: Install system dependencies (Linux gnu)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev libbz2-dev liblzma-dev zlib1g-dev libcurl4-openssl-dev libssl-dev pkg-config

      - name: Install Cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      # --target is always passed, so the binary is at target/<target>/release/ for every
      # entry in the matrix and the packaging step below has one path to find it.
      - name: Build
        if: '!matrix.use_cross'
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build (cross / musl static)
        if: matrix.use_cross
        run: LIBZ_SYS_STATIC=1 cross build --release --locked --target ${{ matrix.target }}

      - name: Verify musl binary is static
        if: matrix.use_cross
        run: |
          file target/${{ matrix.target }}/release/nanoget
          ldd target/${{ matrix.target }}/release/nanoget || true

      - name: Package
        shell: bash
        run: |
          staging="nanoget-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/nanoget" "$staging/"
          cp README.md CHANGELOG.md LICENSE "$staging/"
          tar czf "$staging.tar.gz" -C "$staging" .
          echo "ASSET=$staging.tar.gz" >> "$GITHUB_ENV"

      - name: Attach to release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.ASSET }}

  # Publishing to crates.io is deliberately manual. nanoget-rs has never been published,
  # so the first `cargo publish` permanently claims the name, and a published version can
  # be yanked but never replaced. Run it by hand when that is the intent:
  #
  #     cargo publish --dry-run   # check the packaged crate builds
  #     cargo publish
  #
  # The `exclude` list in Cargo.toml keeps the nanotest fixture submodule out of the
  # package; `cargo package --list` should show no nanotest entries.
